<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow, noarchive">
  <title>Privates Koop-Wiki · Zugang geschützt</title>
  <style>
:root {
  --bg: #0b1118;
  --bg-elev: #121b26;
  --bg-card: #172231;
  --bg-spoiler: #191622;
  --border: #26364a;
  --border-accent: #3b82f6;
  --text: #e6edf5;
  --text-muted: #98abc2;
  --accent: #38bdf8;
  --accent-brick: #d97757;
  --accent-green: #34d399;
  --accent-amber: #fbbf24;
  --accent-red: #f87171;
  --radius: 12px;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.38);
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0;
  font-family: 'Segoe UI', system-ui, -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.62;
}

a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

code {
  font-family: 'Cascadia Code', Consolas, monospace;
  background: rgba(56, 189, 248, 0.11);
  color: #bae6fd;
  padding: 0.14rem 0.4rem;
  border-radius: 5px;
  font-size: 0.88em;
  word-break: break-word;
}

/* Sticky Top Control Bar */
.topbar {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(11, 17, 24, 0.94);
  backdrop-filter: blur(12px);
  border-bottom: 1px solid var(--border);
  padding: 0.7rem 1.25rem;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 0.85rem;
}

.brand {
  display: flex;
  align-items: center;
  gap: 0.75rem;
}
.brand-crest {
  width: 38px;
  height: 38px;
  border-radius: 9px;
  background: linear-gradient(135deg, #9a3412, #0284c7);
  display: grid;
  place-items: center;
  font-weight: 800;
  font-size: 0.95rem;
  color: #fff;
  box-shadow: 0 3px 10px rgba(2, 132, 199, 0.35);
}
.brand-title {
  font-weight: 700;
  font-size: 1.02rem;
  line-height: 1.2;
}
.brand-sub {
  font-size: 0.76rem;
  color: var(--text-muted);
}

.topbar-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 0.75rem;
}

.search-box {
  position: relative;
}
.search-box input {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 0.48rem 0.85rem;
  width: 245px;
  font-size: 0.88rem;
}
.search-box input:focus {
  outline: none;
  border-color: var(--accent);
}

/* Global Spoiler Checkbox Pill */
.spoiler-toggle-pill {
  display: flex;
  align-items: center;
  gap: 0.6rem;
  background: rgba(251, 191, 36, 0.1);
  border: 1px solid rgba(251, 191, 36, 0.4);
  padding: 0.44rem 0.85rem;
  border-radius: 9px;
  cursor: pointer;
  user-select: none;
  font-size: 0.86rem;
  font-weight: 600;
  color: #fde68a;
  transition: all 0.18s ease;
}
.spoiler-toggle-pill:hover {
  background: rgba(251, 191, 36, 0.18);
}
.spoiler-toggle-pill input[type="checkbox"] {
  width: 17px;
  height: 17px;
  accent-color: #f59e0b;
  cursor: pointer;
  margin: 0;
}
body.show-all-spoilers .spoiler-toggle-pill {
  background: rgba(248, 113, 113, 0.16);
  border-color: rgba(248, 113, 113, 0.55);
  color: #fecaca;
}

.menu-btn {
  display: none;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text);
  border-radius: 8px;
  padding: 0.45rem 0.7rem;
  cursor: pointer;
  font-size: 0.9rem;
}

/* Main Shell */
.layout {
  display: grid;
  grid-template-columns: 280px minmax(0, 1fr);
  max-width: 1520px;
  margin: 0 auto;
}

.sidebar {
  position: sticky;
  top: 66px;
  height: calc(100vh - 66px);
  overflow-y: auto;
  padding: 1.25rem 1rem 2rem;
  border-right: 1px solid var(--border);
  background: rgba(18, 27, 38, 0.55);
}

.nav-group-label {
  font-size: 0.72rem;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--text-muted);
  margin: 1rem 0 0.45rem 0.5rem;
  font-weight: 700;
}
.nav-group-label:first-child { margin-top: 0; }

.sidebar a {
  display: block;
  padding: 0.52rem 0.75rem;
  border-radius: 8px;
  color: #cbd5e1;
  font-size: 0.89rem;
  margin-bottom: 0.2rem;
  transition: background 0.15s, color 0.15s;
}
.sidebar a:hover {
  background: rgba(56, 189, 248, 0.1);
  color: #fff;
  text-decoration: none;
}
.sidebar a.active {
  background: rgba(56, 189, 248, 0.18);
  color: var(--accent);
  font-weight: 600;
  border-left: 3px solid var(--accent);
}

.quick-info-box {
  margin-top: 1.3rem;
  padding: 0.85rem;
  border-radius: 10px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 0.81rem;
  color: var(--text-muted);
}
.quick-info-box strong { color: var(--text); display: block; margin-bottom: 0.3rem; }
.quick-info-row {
  display: flex;
  justify-content: space-between;
  padding: 0.2rem 0;
  border-bottom: 1px dashed rgba(255,255,255,0.07);
}
.quick-info-row:last-child { border-bottom: none; }

.content {
  padding: 1.8rem 2.4rem 4rem;
  min-width: 0;
}

.spoiler-banner {
  background: linear-gradient(90deg, rgba(16, 185, 129, 0.13), rgba(56, 189, 248, 0.1));
  border: 1px solid rgba(52, 211, 153, 0.35);
  border-radius: var(--radius);
  padding: 0.9rem 1.2rem;
  margin-bottom: 1.8rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
  font-size: 0.91rem;
}
body.show-all-spoilers .spoiler-banner {
  background: linear-gradient(90deg, rgba(248, 113, 113, 0.15), rgba(251, 191, 36, 0.1));
  border-color: rgba(248, 113, 113, 0.45);
}

.wiki-section {
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 2rem 2.2rem;
  margin-bottom: 2.2rem;
  box-shadow: var(--shadow);
  scroll-margin-top: 84px;
}

.section-header {
  border-bottom: 1px solid var(--border);
  padding-bottom: 1.1rem;
  margin-bottom: 1.5rem;
}
.section-header h2 {
  margin: 0.45rem 0 0.5rem;
  font-size: 1.58rem;
  color: #f8fafc;
}
.lead {
  margin: 0;
  color: var(--text-muted);
  font-size: 1.01rem;
}

h3 {
  margin-top: 1.9rem;
  margin-bottom: 0.75rem;
  font-size: 1.2rem;
  color: #f1f5f9;
}
h4 {
  margin: 0 0 0.45rem;
  font-size: 1.05rem;
  color: #f8fafc;
}
h5 {
  margin: 0 0 0.6rem;
  font-size: 0.96rem;
  text-transform: uppercase;
  letter-spacing: 0.04em;
  color: var(--accent-amber);
}

.badge {
  display: inline-block;
  padding: 0.2rem 0.65rem;
  border-radius: 999px;
  font-size: 0.76rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  background: rgba(56, 189, 248, 0.16);
  color: var(--accent);
}
.badge-green { background: rgba(52, 211, 153, 0.16); color: var(--accent-green); }
.badge-amber { background: rgba(251, 191, 36, 0.16); color: var(--accent-amber); }
.badge-red   { background: rgba(248, 113, 113, 0.18); color: var(--accent-red); }

/* KPI & Tier Grids */
.kpi-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
  gap: 0.9rem;
  margin: 1.25rem 0 1.6rem;
}
.kpi-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 11px;
  padding: 0.95rem 1.1rem;
}
.kpi-card strong {
  display: block;
  font-size: 1.25rem;
  color: var(--accent);
}
.kpi-card span {
  font-size: 0.83rem;
  color: var(--text-muted);
}

.tier-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
  gap: 1rem;
  margin: 1.2rem 0;
}
.tier-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.25rem;
}
.tier-1 { border-top: 4px solid #94a3b8; }
.tier-2 { border-top: 4px solid var(--accent); }
.tier-3 { border-top: 4px solid var(--accent-amber); }
.tier-tag {
  display: inline-block;
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  color: var(--accent-amber);
  margin-bottom: 0.35rem;
}

/* Step Cards */
.step-list {
  display: grid;
  gap: 1rem;
  margin: 1.1rem 0;
}
.step-card {
  display: grid;
  grid-template-columns: 42px minmax(0, 1fr);
  gap: 1rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 1.15rem 1.25rem;
}
.step-num {
  width: 38px;
  height: 38px;
  border-radius: 50%;
  background: rgba(56, 189, 248, 0.18);
  border: 1px solid rgba(56, 189, 248, 0.45);
  color: var(--accent);
  font-weight: 800;
  display: grid;
  place-items: center;
}

/* Images & Galleries */
figure {
  margin: 0;
  background: #0d151f;
  border: 1px solid var(--border);
  border-radius: 12px;
  overflow: hidden;
}
.hero-figure {
  margin: 1.2rem 0 1.5rem;
}
figure img {
  display: block;
  width: 100%;
  height: auto;
  object-fit: cover;
  transition: transform 0.2s ease;
}
figure img.zoomable {
  cursor: zoom-in;
}
figure img.zoomable:hover {
  transform: scale(1.012);
}
figcaption {
  padding: 0.65rem 0.9rem;
  font-size: 0.82rem;
  color: var(--text-muted);
  border-top: 1px solid var(--border);
  background: rgba(18, 27, 38, 0.85);
}

.img-grid-2 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(290px, 1fr));
  gap: 1rem;
  margin: 1.15rem 0 1.5rem;
}
.img-grid-2 figure img {
  aspect-ratio: 16 / 10;
  object-fit: cover;
}

.img-grid-3 {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(230px, 1fr));
  gap: 0.95rem;
  margin: 1.15rem 0 1.5rem;
}
.img-grid-3 figure img {
  aspect-ratio: 4 / 3;
  object-fit: cover;
}

/* Callouts */
.callout {
  border-radius: 11px;
  padding: 1rem 1.2rem;
  margin: 1.2rem 0;
  border-left: 4px solid var(--accent);
  background: rgba(56, 189, 248, 0.08);
}
.callout-warn {
  border-left-color: var(--accent-amber);
  background: rgba(251, 191, 36, 0.09);
}

/* Spoiler System */
.spoiler-box {
  margin: 1.25rem 0;
  border-radius: 12px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  overflow: hidden;
}
.spoiler-summary {
  padding: 1.1rem 1.3rem;
}
.spoiler-summary p:last-child { margin-bottom: 0; }

.spoiler-actionsBar {
  padding: 0.55rem 1.3rem;
  background: rgba(11, 17, 24, 0.55);
  border-top: 1px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 0.75rem;
}
.spoiler-status-tag {
  font-size: 0.78rem;
  color: var(--text-muted);
}
.reveal-single-btn {
  background: rgba(56, 189, 248, 0.13);
  border: 1px solid rgba(56, 189, 248, 0.38);
  color: var(--accent);
  border-radius: 7px;
  padding: 0.32rem 0.75rem;
  font-size: 0.81rem;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s;
}
.reveal-single-btn:hover {
  background: rgba(56, 189, 248, 0.24);
}

.spoiler-secret {
  display: none;
  padding: 1.2rem 1.35rem;
  background: var(--bg-spoiler);
  border-top: 1px dashed rgba(251, 191, 36, 0.4);
}
body.show-all-spoilers .spoiler-secret,
.spoiler-box.revealed-single .spoiler-secret {
  display: block;
}

/* Tables */
.table-wrap {
  overflow-x: auto;
  margin: 1rem 0;
  border-radius: 10px;
  border: 1px solid var(--border);
}
table {
  width: 100%;
  border-collapse: collapse;
  font-size: 0.89rem;
}
th, td {
  text-align: left;
  padding: 0.68rem 0.9rem;
  border-bottom: 1px solid var(--border);
  vertical-align: top;
}
th {
  background: rgba(11, 17, 24, 0.75);
  color: #cbd5e1;
  font-weight: 700;
  white-space: nowrap;
}
tr:last-child td { border-bottom: none; }
tbody tr:hover { background: rgba(255, 255, 255, 0.025); }

/* Filter Bar & Category Pills */
.filter-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  margin-bottom: 1rem;
}
.filter-btn {
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: var(--text-muted);
  border-radius: 999px;
  padding: 0.4rem 0.85rem;
  font-size: 0.83rem;
  font-weight: 600;
  cursor: pointer;
}
.filter-btn:hover { color: var(--text); border-color: var(--accent); }
.filter-btn.active {
  background: rgba(56, 189, 248, 0.2);
  border-color: var(--accent);
  color: var(--accent);
}

.cat-pill {
  display: inline-block;
  padding: 0.15rem 0.55rem;
  border-radius: 999px;
  font-size: 0.75rem;
  font-weight: 600;
  white-space: nowrap;
  background: rgba(148, 163, 184, 0.16);
  color: #cbd5e1;
}
.cat-Weapon { background: rgba(248, 113, 113, 0.16); color: #fca5a5; }
.cat-FirstAid { background: rgba(52, 211, 153, 0.16); color: #6ee7b7; }
.cat-Devices { background: rgba(56, 189, 248, 0.16); color: #7dd3fc; }
.cat-Tool { background: rgba(251, 191, 36, 0.16); color: #fde68a; }
.cat-Food { background: rgba(217, 119, 87, 0.2); color: #fdba74; }
.cat-Cartography { background: rgba(167, 139, 250, 0.18); color: #ddd6fe; }

/* Lightbox Modal */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 999;
  background: rgba(5, 9, 14, 0.92);
  display: none;
  place-items: center;
  padding: 1.5rem;
}
.lightbox.open { display: grid; }
.lightbox-inner {
  max-width: 95vw;
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 0.65rem;
}
.lightbox-inner img {
  max-width: 94vw;
  max-height: 83vh;
  object-fit: contain;
  border-radius: 10px;
  border: 1px solid var(--border);
  box-shadow: 0 20px 60px rgba(0,0,0,0.75);
}
.lightbox-caption {
  color: #e2e8f0;
  font-size: 0.9rem;
  text-align: center;
  max-width: 900px;
}
.lightbox-close {
  position: fixed;
  top: 1rem;
  right: 1.25rem;
  background: var(--bg-card);
  border: 1px solid var(--border);
  color: #fff;
  border-radius: 8px;
  padding: 0.45rem 0.8rem;
  cursor: pointer;
  font-weight: 700;
}

/* Lockscreen (GitHub Pages Encrypted Gate) */
.lock-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  padding: 1.5rem;
  background: radial-gradient(circle at 50% 15%, #172a3f 0%, #0b1118 65%);
}
.lock-card {
  width: 100%;
  max-width: 440px;
  background: var(--bg-elev);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 2.1rem;
  box-shadow: var(--shadow);
}
.lock-card h1 {
  margin: 0.8rem 0 0.4rem;
  font-size: 1.38rem;
}
.lock-card p {
  color: var(--text-muted);
  font-size: 0.91rem;
  margin-top: 0;
}
.lock-input {
  width: 100%;
  padding: 0.72rem 0.9rem;
  border-radius: 9px;
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text);
  font-size: 1rem;
  margin-bottom: 0.8rem;
}
.lock-input:focus { outline: none; border-color: var(--accent); }
.lock-btn {
  width: 100%;
  padding: 0.75rem 1rem;
  border-radius: 9px;
  border: none;
  background: linear-gradient(135deg, #0284c7, #0369a1);
  color: #fff;
  font-weight: 700;
  font-size: 0.96rem;
  cursor: pointer;
}
.lock-btn:hover { filter: brightness(1.08); }
.lock-btn:disabled { opacity: 0.6; cursor: wait; }
.lock-remember {
  display: flex;
  align-items: center;
  gap: 0.5rem;
  font-size: 0.84rem;
  color: var(--text-muted);
  margin-bottom: 1rem;
  cursor: pointer;
}
.lock-error {
  color: var(--accent-red);
  font-size: 0.85rem;
  margin-top: 0.75rem;
  min-height: 1.2em;
}

@media (max-width: 980px) {
  .layout { grid-template-columns: 1fr; }
  .menu-btn { display: inline-block; }
  .sidebar {
    display: none;
    position: fixed;
    top: 64px;
    left: 0;
    right: 0;
    bottom: 0;
    height: auto;
    z-index: 95;
    background: var(--bg-elev);
  }
  .sidebar.open { display: block; }
  .content { padding: 1.2rem 1rem 3rem; }
  .wiki-section { padding: 1.35rem 1.2rem; }
}
</style>
</head>
<body>
<div id="appRoot">
  <div class="lock-screen">
    <form class="lock-card" id="unlockForm">
      <div class="brand">
        <div class="brand-crest">26</div>
        <div>
          <div class="brand-title">Privates Koop-Handbuch</div>
          <div class="brand-sub">AES-256-GCM verschlüsselt</div>
        </div>
      </div>
      <h1>Zugang zum Wiki entsperren</h1>
      <p>Bitte gib euer gemeinsames Server-Passwort ein, um Karte, Server-Anleitungen, Items und (optional einblendbare) Quest-Lösungen zu entschlüsseln.</p>
      <input type="password" id="pwInput" class="lock-input" placeholder="Passwort eingeben …" autocomplete="current-password" required autofocus>
      <label class="lock-remember">
        <input type="checkbox" id="rememberPw" checked>
        <span>Auf diesem Gerät angemeldet bleiben</span>
      </label>
      <button type="submit" class="lock-btn" id="unlockBtn">🔓 Wiki entschlüsseln &amp; öffnen</button>
      <div class="lock-error" id="lockError"></div>
    </form>
  </div>
</div>

<script>

function initWikiUI() {
  const globalToggle = document.getElementById('globalSpoilerToggle');
  const bannerStatus = document.getElementById('spoilerBannerText');
  const searchInput = document.getElementById('wikiSearch');
  const menuBtn = document.getElementById('mobileMenuBtn');
  const sidebar = document.getElementById('wikiSidebar');

  // 1. Setup individual per-section Spoiler Reveal bars
  document.querySelectorAll('.spoiler-box').forEach((box) => {
    if (box.querySelector('.spoiler-actionsBar')) return;
    const summary = box.querySelector('.spoiler-summary');
    const secret = box.querySelector('.spoiler-secret');
    if (!summary || !secret) return;

    const bar = document.createElement('div');
    bar.className = 'spoiler-actionsBar';

    const statusTag = document.createElement('span');
    statusTag.className = 'spoiler-status-tag';
    statusTag.textContent = '🔒 Detaillierter Lösungsweg & exakte Koordinaten ausgeblendet';

    const btn = document.createElement('button');
    btn.type = 'button';
    btn.className = 'reveal-single-btn';
    btn.textContent = '👁️ Nur diesen Abschnitt aufdecken';

    btn.addEventListener('click', () => {
      const open = box.classList.toggle('revealed-single');
      btn.textContent = open ? '🙈 Diesen Abschnitt wieder verbergen' : '👁️ Nur diesen Abschnitt aufdecken';
      statusTag.textContent = open
        ? '🔓 Einzel-Spoiler für diesen Abschnitt eingeblendet'
        : '🔒 Detaillierter Lösungsweg & exakte Koordinaten ausgeblendet';
    });

    bar.appendChild(statusTag);
    bar.appendChild(btn);
    box.insertBefore(bar, secret);
  });

  // 2. Global Spoiler Checkbox
  function applyGlobalSpoilers(checked) {
    document.body.classList.toggle('show-all-spoilers', checked);
    if (bannerStatus) {
      bannerStatus.innerHTML = checked
        ? '<strong>⚠️ Vollständiger Spoiler- &amp; Lösungs-Modus aktiv:</strong> Alle Koordinaten, Quest-Schritte, Schlüsselkarten-Fundorte und Geheimnisse sind jetzt sichtbar.'
        : '<strong>🛡️ Spoiler-Schutz aktiv (Standard):</strong> Du siehst nur spoilerfreie Zusammenfassungen. Setze oben rechts den Haken für alle Lösungen oder decke einzelne Abschnitte gezielt auf.';
    }
  }

  if (globalToggle) {
    const savedPref = localStorage.getItem('jeverland_show_spoilers') === '1';
    globalToggle.checked = savedPref;
    applyGlobalSpoilers(savedPref);
    globalToggle.addEventListener('change', () => {
      localStorage.setItem('jeverland_show_spoilers', globalToggle.checked ? '1' : '0');
      applyGlobalSpoilers(globalToggle.checked);
    });
  }

  // 3. Mobile menu toggle
  if (menuBtn && sidebar) {
    menuBtn.addEventListener('click', () => sidebar.classList.toggle('open'));
    sidebar.querySelectorAll('a').forEach((a) => {
      a.addEventListener('click', () => sidebar.classList.remove('open'));
    });
  }

  // 4. Item Category Filters + Search
  const filterBar = document.getElementById('itemFilterBar');
  const itemRows = Array.from(document.querySelectorAll('#itemsTable tbody tr'));
  let activeCat = 'ALL';

  function filterItemsAndSections() {
    const q = (searchInput ? searchInput.value : '').trim().toLowerCase();

    itemRows.forEach((row) => {
      const catMatch = activeCat === 'ALL' || row.dataset.cat === activeCat;
      const textMatch = !q || row.textContent.toLowerCase().includes(q);
      row.style.display = catMatch && textMatch ? '' : 'none';
    });

    // Also dim non-matching sections slightly or scroll if needed? Better: filter rows cleanly & highlight matching sections in nav
    document.querySelectorAll('.wiki-section').forEach((sec) => {
      const navLink = document.querySelector('.sidebar a[href="#' + sec.id + '"]');
      if (!navLink) return;
      if (q && sec.textContent.toLowerCase().includes(q)) {
        navLink.style.borderRight = '3px solid #34d399';
      } else {
        navLink.style.borderRight = '';
      }
    });
  }

  if (filterBar) {
    // Update button counts dynamically
    filterBar.querySelectorAll('.filter-btn').forEach((btn) => {
      const cat = btn.dataset.cat;
      if (cat && cat !== 'ALL') {
        const count = itemRows.filter((r) => r.dataset.cat === cat).length;
        btn.textContent = btn.textContent + ' (' + count + ')';
      }
      btn.addEventListener('click', () => {
        filterBar.querySelectorAll('.filter-btn').forEach((b) => b.classList.remove('active'));
        btn.classList.add('active');
        activeCat = cat;
        filterItemsAndSections();
      });
    });
  }

  if (searchInput) {
    searchInput.addEventListener('input', filterItemsAndSections);
  }

  // 5. Lightbox for all .zoomable images
  const lightbox = document.getElementById('wikiLightbox');
  const lbImg = document.getElementById('lightboxImg');
  const lbCap = document.getElementById('lightboxCaption');
  const lbClose = document.getElementById('lightboxClose');

  if (lightbox && lbImg) {
    document.querySelectorAll('img.zoomable').forEach((img) => {
      img.addEventListener('click', () => {
        lbImg.src = img.src;
        const fig = img.closest('figure');
        const cap = fig ? fig.querySelector('figcaption') : null;
        lbCap.textContent = cap ? cap.textContent : (img.alt || '');
        lightbox.classList.add('open');
      });
    });

    const closeLb = () => {
      lightbox.classList.remove('open');
      lbImg.src = '';
    };
    if (lbClose) lbClose.addEventListener('click', closeLb);
    lightbox.addEventListener('click', (e) => {
      if (e.target === lightbox) closeLb();
    });
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeLb();
    });
  }

  // 6. Scroll spy for sidebar active state
  const sections = Array.from(document.querySelectorAll('.wiki-section'));
  const navLinks = Array.from(document.querySelectorAll('.sidebar a[href^="#"]'));
  window.addEventListener('scroll', () => {
    let currentId = sections[0] ? sections[0].id : '';
    for (const sec of sections) {
      if (sec.getBoundingClientRect().top <= 130) {
        currentId = sec.id;
      }
    }
    navLinks.forEach((a) => {
      a.classList.toggle('active', a.getAttribute('href') === '#' + currentId);
    });
  }, { passive: true });
}


(function() {
  const ITERATIONS = 150000;
  const form = document.getElementById('unlockForm');
  const pwInput = document.getElementById('pwInput');
  const rememberPw = document.getElementById('rememberPw');
  const unlockBtn = document.getElementById('unlockBtn');
  const lockError = document.getElementById('lockError');
  const appRoot = document.getElementById('appRoot');
  let cachedPayload = null;

  async function fetchPayload() {
    if (cachedPayload) return cachedPayload;
    const res = await fetch('./payload.enc', { cache: 'no-cache' });
    if (!res.ok) throw new Error('Verschlüsseltes Paket konnte nicht geladen werden (HTTP ' + res.status + ').');
    cachedPayload = new Uint8Array(await res.arrayBuffer());
    return cachedPayload;
  }

  async function unlockWithPassword(pw, fromSaved) {
    lockError.textContent = '';
    unlockBtn.disabled = true;
    unlockBtn.textContent = '⏳ Entschlüssele Datenpaket …';
    try {
      const raw = await fetchPayload();
      const salt = raw.slice(0, 16);
      const iv = raw.slice(16, 28);
      const dataWithTag = raw.slice(28);

      const enc = new TextEncoder();
      const baseKey = await window.crypto.subtle.importKey(
        'raw',
        enc.encode(pw),
        { name: 'PBKDF2' },
        false,
        ['deriveKey']
      );
      const aesKey = await window.crypto.subtle.deriveKey(
        { name: 'PBKDF2', salt: salt, iterations: ITERATIONS, hash: 'SHA-256' },
        baseKey,
        { name: 'AES-GCM', length: 256 },
        false,
        ['decrypt']
      );
      const decryptedBuf = await window.crypto.subtle.decrypt(
        { name: 'AES-GCM', iv: iv },
        aesKey,
        dataWithTag
      );
      const decoded = JSON.parse(new TextDecoder().decode(decryptedBuf));
      if (rememberPw && rememberPw.checked) {
        localStorage.setItem('jeverland_wiki_pw', pw);
      } else if (!fromSaved) {
        localStorage.removeItem('jeverland_wiki_pw');
      }
      document.title = 'Jeverland & Wilhelmshaven – Koop-Wiki & Server-Handbuch (v10.0)';
      appRoot.innerHTML = decoded.html;
      initWikiUI();
    } catch (err) {
      if (fromSaved) {
        localStorage.removeItem('jeverland_wiki_pw');
      } else {
        lockError.textContent = 'Falsches Passwort oder Entschlüsselung fehlgeschlagen.';
      }
      unlockBtn.disabled = false;
      unlockBtn.textContent = '🔓 Wiki entschlüsseln & öffnen';
    }
  }

  form.addEventListener('submit', (e) => {
    e.preventDefault();
    unlockWithPassword(pwInput.value, false);
  });

  const saved = localStorage.getItem('jeverland_wiki_pw');
  if (saved) {
    unlockWithPassword(saved, true);
  }
})();
</script>
